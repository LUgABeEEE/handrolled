[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handrolled"
description = "Hand-rolled, stdlib-only building blocks for agent tooling: CJK full-text search, WebDAV, network mounts, and import adapters."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "handrolled contributors" }]
keywords = ["stdlib", "zero-dependency", "sqlite-fts5", "cjk", "webdav", "markdown", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]
# The whole point: nothing to install, nothing to keep patched.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/LUgABeEEE/handrolled"
Source = "https://github.com/LUgABeEEE/handrolled"
Issues = "https://github.com/LUgABeEEE/handrolled/issues"

[tool.setuptools.dynamic]
version = { attr = "handrolled.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handrolled = ["py.typed"]
