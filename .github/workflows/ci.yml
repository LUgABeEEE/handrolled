name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is deliberately offline and dependency-free, so this is the
      # whole setup.  If it ever needs the network, something went wrong.
      - name: Run the test-suite
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v

      - name: The package installs and imports
        run: |
          python -m pip install --quiet .
          python -c "import handrolled, sys; print('import ok', handrolled.__version__)"
          python - <<'PY'
          import sys
          import handrolled, handrolled.text, handrolled.webdav, handrolled.mounts
          import handrolled.pages, handrolled.importers
          bad = [m for m in ("requests", "yaml", "numpy") if m in sys.modules]
          assert not bad, f"importing the package pulled in {bad}"
          PY

  packaging:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel has no runtime dependencies
        run: |
          python - <<'PY'
          import email.parser, pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              parsed = email.parser.Parser().parsestr(z.read(meta).decode())
          deps = parsed.get_all("Requires-Dist") or []
          assert not deps, f"unexpected runtime dependencies: {deps}"
          print("no Requires-Dist, as promised")
          PY

  hygiene:
    name: privacy and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials, no personal paths, no build artifacts
        run: |
          set -eu
          fail=0

          if git grep -nIE '(password|passwd|secret|api[_-]?key|access[_-]?key|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"']?[^[:space:]"'"'"'`,;)]{8,}' \
               -- . ':!*.lock' | grep -vE 'os\.environ|self\.password|password[[:space:]]*=[[:space:]]*(password|value)|DSH_KB_[A-Z_]*PASSWORD'; then
            echo "::error::credential-shaped assignment found"; fail=1
          fi

          if git grep -nIE '(^|[^0-9])(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}' -- .; then
            echo "::error::private IP address found"; fail=1
          fi

          if git grep -nIE '(/data/agent/|/home/[a-z0-9_-]+/(kb|dsh)|[A-Z]:\\Users\\[A-Za-z0-9_-]+)' \
               -- . ':!*.lock' ':!.github/workflows/ci.yml' | grep -vE '192\.0\.2\.'; then
            echo "::error::machine-specific path found"; fail=1
          fi

          if git ls-files | grep -E '(__pycache__|\.pyc$|\.sqlite|\.egg-info|^dist/|^build/)'; then
            echo "::error::build artifact is tracked"; fail=1
          fi

          exit $fail
